<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xác nhận tải lên</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#eef2f6}
a{color:#0170C1}a:hover{color:#015FA4}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:600;color:#4D6278;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:12px 16px;border-bottom:1px solid #e2e8f0;background:#fff;white-space:nowrap}
td{padding:14px 16px;border-bottom:1px solid #eef2f6;vertical-align:middle;color:#2B4058;font-variant-numeric:tabular-nums}
tr:hover td{background:#f8fafc}
tbody tr:last-child td{border-bottom:none}
input::placeholder{color:#4D6278}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px}
.shell{display:grid;grid-template-columns:280px minmax(0,1fr)}
@media (max-width:760px){.shell{grid-template-columns:1fr}.side{display:none}}
span[style*="border-radius:999px"]::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7;margin-right:6px;flex:none}
button,select,input,textarea{font-family:inherit}
</style>

<link rel="stylesheet" href="assets/hvs-theme.css">
<script src="assets/hvs-app.js" defer></script>
</head>
<body>
<div style="min-height:100vh;box-sizing:border-box;padding:48px 16px;background:#5d6a78;font-family:'Inter', system-ui, sans-serif;color:#0f1c29;font-size:14px;display:flex;justify-content:center;align-items:flex-start">
<section role="dialog" aria-modal="true" aria-labelledby="xn-title" style="width:100%;max-width:820px;background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(15,28,41,.35);display:flex;flex-direction:column;min-width:0">
<header style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 22px;border-bottom:1px solid #e2e8f0"><div style="display:flex;flex-direction:column;gap:4px"><span style="font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#4D6278">Lập PDA · tải chứng từ</span><h2 id="xn-title" style="margin:0;font-size:20px;font-weight:700">Xác nhận chứng từ vừa tải lên</h2></div><a href="LapPDA.html" aria-label="Đóng" style="display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:8px;border:1px solid #e2e8f0;color:#0f1c29;text-decoration:none;font-size:18px">×</a></header>
<form data-validate data-next="LapPDA.html" data-done="Đã lưu chứng từ — xem ở tab Trip Ledger" style="display:flex;flex-direction:column;min-width:0;margin:0">
<div style="padding:18px 22px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;min-width:0"><div style="display:flex;flex-direction:column;gap:8px;min-width:0"><div style="height:300px;border:1px dashed #94a3b8;border-radius:8px;background:repeating-linear-gradient(45deg,#f1f5f9,#f1f5f9 10px,#e9eef3 10px,#e9eef3 20px);display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;box-sizing:border-box;color:#4D6278;font-size:14px">[Xem trước file vừa tải lên]</div><span class="mono" style="font-size:13px;color:#2B4058">Thông báo phí cảng vụ.pdf · 1 trang</span></div><div style="display:flex;flex-direction:column;gap:12px;min-width:0"><p class="req-note" style="margin:0"><span aria-hidden="true">*</span> Bắt buộc</p><dl style="margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px"><div><dt style="font-size:13px;color:#4D6278;margin-bottom:2px">Gắn với dòng PDA</dt><dd style="margin:0;font-size:14px;font-weight:500">Cảng phí</dd></div><div><dt style="font-size:13px;color:#4D6278;margin-bottom:2px">Chuyến</dt><dd style="margin:0;font-size:14px;font-weight:500">MV OLDENDORFF TRADER</dd></div></dl><label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;min-width:0"><span class="lbl">Số hoá đơn / chứng từ<span class="req" aria-hidden="true"> *</span></span><input type="text" name="so-hd" required placeholder="[số như in trên chứng từ]" style="height:42px;box-sizing:border-box;padding:0 10px;border:1px solid #e2e8f0;border-radius:8px;font:inherit;font-weight:400;font-size:14px;background:#fff;width:100%"></label><label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;min-width:0">Nhà cung cấp<input type="text" placeholder="VD: Cảng vụ HH Thanh Hoá" style="height:42px;box-sizing:border-box;padding:0 10px;border:1px solid #e2e8f0;border-radius:8px;font:inherit;font-weight:400;font-size:14px;background:#fff;width:100%"></label><label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;min-width:0"><span class="lbl">Ngày<span class="req" aria-hidden="true"> *</span></span><span style="font-weight:400;font-size:13px;color:#4D6278">dd/mm/yyyy</span><input type="text" name="ngay" required inputmode="numeric" pattern="(0[1-9]|[12][0-9]|3[01])/(0[1-9]|1[0-2])/[0-9]{4}" data-error-msg="Nhập ngày dạng dd/mm/yyyy, VD 09/09/2026." placeholder="09/09/2026" style="height:42px;box-sizing:border-box;padding:0 10px;border:1px solid #e2e8f0;border-radius:8px;font:inherit;font-weight:400;font-size:14px;background:#fff;width:100%"></label><label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;min-width:0"><span class="lbl">Tổng tiền<span class="req" aria-hidden="true"> *</span></span><input type="text" name="tong-tien" required inputmode="decimal" pattern="[0-9][0-9.,]*" data-error-msg="Chỉ nhập số, VD 42,500,000." placeholder="[số tiền]" style="height:42px;box-sizing:border-box;padding:0 10px;border:1px solid #e2e8f0;border-radius:8px;font:inherit;font-weight:400;font-size:14px;background:#fff;width:100%"></label><div style="padding:10px 14px;border-radius:8px;font-size:14px;background:#E3F1FB;border:1px solid #B5DBF4;color:#015FA4">Bấm “Xác nhận &amp; lưu”: chứng từ được lưu và hiện ở tab Trip Ledger.</div></div></div>
<footer style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 22px;border-top:1px solid #e2e8f0;background:#f8fafc;border-radius:0 0 14px 14px"><span style="font-size:13px;color:#4D6278">Huỷ: bỏ file vừa tải lên, không lưu.</span><div style="display:flex;gap:8px"><a href="LapPDA.html" style="display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:8px;font-size:14px;font-weight:600;text-decoration:none;background:#fff;color:#0f1c29;border:1px solid #e2e8f0">Huỷ</a><button type="submit" style="display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:8px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;background:#0170C1;color:#fff;border:1px solid #0170C1">Xác nhận &amp; lưu</button></div></footer>
</form>
</section>
</div>

</body>
</html>
