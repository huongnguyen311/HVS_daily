<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xác nhận tải lên</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#eef2f6}
a{color:#0170C1}a:hover{color:#015FA4}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;color:#64748b;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:12px 16px;border-bottom:1px solid #e2e8f0;background:#fff;white-space:nowrap}
td{padding:14px 16px;border-bottom:1px solid #eef2f6;vertical-align:middle;color:#33475b;font-variant-numeric:tabular-nums}
tr:hover td{background:#f8fafc}
tbody tr:last-child td{border-bottom:none}
input::placeholder{color:#64748b}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12.5px}
.shell{display:grid;grid-template-columns:280px minmax(0,1fr)}
@media (max-width:760px){.shell{grid-template-columns:1fr}.side{display:none}}
span[style*="border-radius:999px"]::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7;margin-right:6px;flex:none}
button,select,input,textarea{font-family:inherit}
</style>

</head>
<body>
<div style="min-height:100vh;box-sizing:border-box;padding:48px 16px;background:#5d6a78;font-family:'Be Vietnam Pro', system-ui, sans-serif;color:#0f1c29;font-size:14px;display:flex;justify-content:center;align-items:flex-start">
<section role="dialog" aria-modal="true" aria-labelledby="xn-title" style="width:100%;max-width:820px;background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(15,28,41,.35);display:flex;flex-direction:column;min-width:0">
<header style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 22px;border-bottom:1px solid #e2e8f0"><div style="display:flex;flex-direction:column;gap:4px"><span style="font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#64748b">Lập PDA · tải chứng từ</span><h2 id="xn-title" style="margin:0;font-size:20px;font-weight:700">Xác nhận chứng từ vừa tải lên</h2></div><a href="LapPDA.html" aria-label="Đóng" style="display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:8px;border:1px solid #e2e8f0;color:#0f1c29;text-decoration:none;font-size:18px">×</a></header>
<div style="padding:18px 22px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;min-width:0"><div style="display:flex;flex-direction:column;gap:8px;min-width:0"><div style="height:300px;border:1px dashed #94a3b8;border-radius:8px;background:repeating-linear-gradient(45deg,#f1f5f9,#f1f5f9 10px,#e9eef3 10px,#e9eef3 20px);display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;box-sizing:border-box;color:#64748b;font-size:13px">[Xem trước file vừa tải lên]</div><span class="mono" style="font-size:12.5px;color:#33475b">Thông báo phí cảng vụ.pdf · 1 trang</span></div><div style="display:flex;flex-direction:column;gap:12px;min-width:0"><dl style="margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px"><div><dt style="font-size:12px;color:#64748b;margin-bottom:2px">Gắn với dòng PDA</dt><dd style="margin:0;font-size:13.5px;font-weight:500">Cảng phí</dd></div><div><dt style="font-size:12px;color:#64748b;margin-bottom:2px">Chuyến</dt><dd style="margin:0;font-size:13.5px;font-weight:500">MV SEA PIONEER</dd></div></dl><label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;min-width:0">Số hoá đơn / chứng từ<input type="text" placeholder="[số như in trên chứng từ]" style="height:42px;box-sizing:border-box;padding:0 10px;border:1px solid #e2e8f0;border-radius:8px;font:inherit;font-weight:400;font-size:13.5px;background:#fff;width:100%"></label><label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;min-width:0">Nhà cung cấp<input type="text" placeholder="Cảng vụ HH Thanh Hoá" style="height:42px;box-sizing:border-box;padding:0 10px;border:1px solid #e2e8f0;border-radius:8px;font:inherit;font-weight:400;font-size:13.5px;background:#fff;width:100%"></label><label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;min-width:0">Ngày<input type="text" placeholder="dd/mm/yyyy" style="height:42px;box-sizing:border-box;padding:0 10px;border:1px solid #e2e8f0;border-radius:8px;font:inherit;font-weight:400;font-size:13.5px;background:#fff;width:100%"></label><label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;min-width:0">Tổng tiền<input type="text" placeholder="[số tiền]" style="height:42px;box-sizing:border-box;padding:0 10px;border:1px solid #e2e8f0;border-radius:8px;font:inherit;font-weight:400;font-size:13.5px;background:#fff;width:100%"></label><div style="padding:10px 14px;border-radius:8px;font-size:13px;background:#E3F1FB;border:1px solid #B5DBF4;color:#015FA4">Bấm “Xác nhận &amp; lưu”: chứng từ được lưu và hiện ở tab Trip.</div></div></div>
<footer style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 22px;border-top:1px solid #e2e8f0;background:#f8fafc;border-radius:0 0 14px 14px"><span style="font-size:12.5px;color:#64748b">Huỷ: bỏ file vừa tải lên, không lưu.</span><div style="display:flex;gap:8px"><a href="LapPDA.html" style="display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:8px;font-size:14px;font-weight:600;text-decoration:none;background:#fff;color:#0f1c29;border:1px solid #e2e8f0">Huỷ</a><a href="TripLedger.html" style="display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:8px;font-size:14px;font-weight:600;text-decoration:none;background:#0170C1;color:#fff;border:1px solid #0170C1">Xác nhận &amp; lưu</a></div></footer>
</section>
</div>

</body>
</html>
