<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">

<title>Đăng nhập</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#062B4D}
a{color:#0170C1}
input::placeholder{color:#64748b}
</style>

</head>
<body>
<div style="min-height:100vh;background:#062B4D;font-family:'Be Vietnam Pro', system-ui, sans-serif;color:#0f1c29;font-size:14px;display:flex;align-items:center;justify-content:center;padding:48px 16px;box-sizing:border-box">
<main style="width:100%;max-width:420px;display:flex;flex-direction:column;gap:24px">
<div style="display:flex;flex-direction:column;gap:8px;padding:0 4px 24px"><div style="background:#fff;border-radius:10px;padding:10px 14px;display:flex;align-items:center;max-width:220px"><img src="assets/hvs-logo.png" alt="HVS Group" width="477" height="94" style="width:100%;height:auto;display:block"></div><div style="font-size:11px;color:#94a3b8;padding:0 8px">Agency Ops · Web</div></div>
<form style="background:#fff;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 1px 2px rgba(15,28,41,.04),0 1px 3px rgba(15,28,41,.06);padding:28px;display:flex;flex-direction:column;gap:18px">
<div><h1 style="margin:0;font-size:24px;font-weight:700;letter-spacing:-0.01em">Đăng nhập</h1><p style="margin:6px 0 0;color:#64748b;font-size:14px">Dùng tài khoản công ty để vào hệ thống.</p></div>
<label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600">Email<input type="email" placeholder="ten@haivanship.com" style="height:44px;box-sizing:border-box;padding:0 14px;border:1px solid #e2e8f0;border-radius:8px;font:inherit;font-weight:400;font-size:14px"></label>
<label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600">Mật khẩu<input type="password" placeholder="••••••••" style="height:44px;box-sizing:border-box;padding:0 14px;border:1px solid #e2e8f0;border-radius:8px;font:inherit;font-weight:400;font-size:14px"></label>
<a href="KeHoachThang.html" style="display:inline-flex;align-items:center;justify-content:center;min-height:44px;border-radius:8px;font-size:14px;font-weight:600;text-decoration:none;background:#0170C1;color:#fff">Đăng nhập</a>
<span style="color:#64748b;font-size:12px;text-align:center">Sau khi đăng nhập: Kế hoạch tàu tháng.</span>
</form>
</main>
