<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thêm dịch vụ</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#eef2f6}
a{color:#0170C1}a:hover{color:#015FA4}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:600;color:#4D6278;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:12px 16px;border-bottom:1px solid #e2e8f0;background:#fff;white-space:nowrap}
td{padding:14px 16px;border-bottom:1px solid #eef2f6;vertical-align:middle;color:#2B4058;font-variant-numeric:tabular-nums}
tr:hover td{background:#f8fafc}
tbody tr:last-child td{border-bottom:none}
input::placeholder{color:#4D6278}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px}
.shell{display:grid;grid-template-columns:280px minmax(0,1fr)}
@media (max-width:760px){.shell{grid-template-columns:1fr}.side{display:none}}
span[style*="border-radius:999px"]::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7;margin-right:6px;flex:none}
button,select,input,textarea{font-family:inherit}
</style>

<link rel="stylesheet" href="assets/hvs-theme.css">
<script src="assets/hvs-app.js" defer></script>
</head>
<body>
<div style="min-height:100vh;box-sizing:border-box;padding:48px 16px;background:#5d6a78;font-family:'Inter', system-ui, sans-serif;color:#0f1c29;font-size:14px;display:flex;justify-content:center;align-items:flex-start">
<section role="dialog" aria-modal="true" aria-labelledby="tdv-title" style="width:100%;max-width:680px;background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(15,28,41,.35);display:flex;flex-direction:column;min-width:0">
<header style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 22px;border-bottom:1px solid #e2e8f0"><div style="display:flex;flex-direction:column;gap:4px"><span style="font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#4D6278">Lập PDA · NS2 (bên trả)</span><h2 id="tdv-title" style="margin:0;font-size:20px;font-weight:700">Thêm dịch vụ</h2><span style="font-size:13px;color:#4D6278">MV OLDENDORFF TRADER · <span class="mono">NS2PC-2609</span></span></div><a href="LapPDA.html" aria-label="Đóng" style="display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:8px;border:1px solid #e2e8f0;color:#0f1c29;text-decoration:none;font-size:18px">×</a></header>
<form data-validate data-next="LapPDA.html" data-done="Đã thêm dịch vụ vào PDA" style="margin:0;display:flex;flex-direction:column;min-width:0">
<div style="padding:18px 22px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px;min-width:0"><label style="grid-column:1 / -1;display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;min-width:0"><span class="lbl">Loại dịch vụ<span class="req" aria-hidden="true"> *</span></span><select id="tdv-loai" name="tdv-loai" required style="height:42px;box-sizing:border-box;padding:0 10px;border:1px solid #e2e8f0;border-radius:8px;font:inherit;font-weight:400;font-size:14px;background:#fff;width:100%"><option value="" disabled selected>Chọn dịch vụ…</option><option>Rác / sludge</option><option>Nước ngọt</option><option>Crew change</option><option>Tàu lai</option><option>Hoa tiêu</option><option>Kiểm dịch</option></select></label><label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;min-width:0">Bên yêu cầu<select style="height:42px;box-sizing:border-box;padding:0 10px;border:1px solid #e2e8f0;border-radius:8px;font:inherit;font-weight:400;font-size:14px;background:#fff;width:100%"><option>Master</option><option>Owner</option><option>Charterer</option><option>Principal</option></select></label><label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;min-width:0">Thời gian phục vụ<input type="text" placeholder="dd/mm/yyyy hh:mm" style="height:42px;box-sizing:border-box;padding:0 10px;border:1px solid #e2e8f0;border-radius:8px;font:inherit;font-weight:400;font-size:14px;background:#fff;width:100%"></label><label style="grid-column:1 / -1;display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;min-width:0">Phạm vi · số lượng<input type="text" placeholder="ví dụ 20 m³, 2 thuyền viên" style="height:42px;box-sizing:border-box;padding:0 10px;border:1px solid #e2e8f0;border-radius:8px;font:inherit;font-weight:400;font-size:14px;background:#fff;width:100%"></label><label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;min-width:0">Vendor<select style="height:42px;box-sizing:border-box;padding:0 10px;border:1px solid #e2e8f0;border-radius:8px;font:inherit;font-weight:400;font-size:14px;background:#fff;width:100%"><option>Chọn vendor…</option><option>[vendor]</option></select></label><label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;min-width:0"><span class="lbl">Báo giá cho khách<span class="req" aria-hidden="true"> *</span></span><input type="text" id="tdv-gia" name="tdv-gia" required inputmode="decimal" pattern="[0-9][0-9.,]*" data-error-msg="Chỉ nhập số, ví dụ 3,500,000." placeholder="ví dụ 3,500,000" style="height:42px;box-sizing:border-box;padding:0 10px;border:1px solid #e2e8f0;border-radius:8px;font:inherit;font-weight:400;font-size:14px;background:#fff;width:100%"></label><label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;min-width:0">Tiền tệ<select style="height:42px;box-sizing:border-box;padding:0 10px;border:1px solid #e2e8f0;border-radius:8px;font:inherit;font-weight:400;font-size:14px;background:#fff;width:100%"><option>VND</option><option>USD</option></select></label><label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;min-width:0">%VAT<input type="text" placeholder="ví dụ 8%" style="height:42px;box-sizing:border-box;padding:0 10px;border:1px solid #e2e8f0;border-radius:8px;font:inherit;font-weight:400;font-size:14px;background:#fff;width:100%"></label><label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;min-width:0"><span class="lbl">Bên trả<span class="req" aria-hidden="true"> *</span></span><select id="tdv-bentra" name="tdv-bentra" required style="height:42px;box-sizing:border-box;padding:0 10px;border:1px solid #e2e8f0;border-radius:8px;font:inherit;font-weight:400;font-size:14px;background:#fff;width:100%"><option value="" disabled>Chọn bên trả…</option><option selected>NS2</option><option>OCVN</option></select></label><label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;min-width:0"><span class="lbl">Phương thức<span class="req" aria-hidden="true"> *</span></span><select id="tdv-pt" name="tdv-pt" required style="height:42px;box-sizing:border-box;padding:0 10px;border:1px solid #e2e8f0;border-radius:8px;font:inherit;font-weight:400;font-size:14px;background:#fff;width:100%"><option>FDA</option><option>Cash</option></select></label><label style="grid-column:1 / -1;display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;min-width:0">Ghi chú<textarea rows="2" placeholder="Ghi chú nội bộ" style="height:42px;box-sizing:border-box;padding:0 10px;border:1px solid #e2e8f0;border-radius:8px;font:inherit;font-weight:400;font-size:14px;background:#fff;width:100%;height:auto;padding:8px 10px;resize:vertical"></textarea></label><div style="grid-column:1 / -1;padding:10px 14px;border-radius:8px;font-size:14px;background:#fff;border:1px solid #e2e8f0;color:#4D6278">Bấm “Thêm vào PDA”: dịch vụ thành một dòng chi phí mới của PDA (VAT riêng dòng) và đồng thời xuất hiện ở tab Dịch vụ với trạng thái “Yêu cầu”.</div></div>
<footer style="display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:14px 22px;border-top:1px solid #e2e8f0;background:#f8fafc;border-radius:0 0 14px 14px"><span class="req-note" style="margin-right:auto">* Bắt buộc</span><a href="LapPDA.html" style="display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:8px;font-size:14px;font-weight:600;text-decoration:none;background:#fff;color:#0f1c29;border:1px solid #e2e8f0">Huỷ</a><button type="submit" style="display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:8px;font-size:14px;font-weight:600;text-decoration:none;cursor:pointer;font-family:inherit;background:#0170C1;color:#fff;border:1px solid #0170C1">Thêm vào PDA</button></footer>
</form>
</section>
</div>

</body>
</html>
